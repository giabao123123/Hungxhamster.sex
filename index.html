      }

        const route = () => {
          const raw = location.hash.slice(1) || "home",
            h = legal.includes(raw) ? "legal" : raw;
          pages.forEach((p) => (p.hidden = p.id !== h));
          if (h === "legal") document.getElementById(raw)?.scrollIntoView();
        };
        addEventListener("hashchange", route);
        route();

        const lib = document.getElementById("lib");
        const ITEMS = [
          { title: "Tiêu đề 1", img: "1.jpg" },
          { title: "Tiêu đề 2", img: "2.jpg" },
          // thêm hoặc bớt dòng tùy số ảnh
        ];
        ITEMS.forEach((it) => {
          const d = document.createElement("div");
          d.className = "ph";
          d.style.backgroundImage = `url(${it.img})`;
          d.innerHTML = `<span>${it.title}</span>`;
          lib.append(d);
        });
        document.getElementById("lock-note").hidden = CONFIG.isMember;
        // Hiệu ứng: thẻ hiện dần lần lượt khi cuộn tới
        const io = new IntersectionObserver(
          (es) =>
            es.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("in");
                io.unobserve(e.target);
              }
            }),
          { threshold: 0.15 },
        );
        document
          .querySelectorAll("#lib .ph, .plans article")
          .forEach((el, i) => {
            el.classList.add("rv");
            el.style.setProperty("--i", i % 8);
            io.observe(el);
          });

        const pay = document.getElementById("pay");
        document.querySelectorAll("[data-plan]").forEach(
          (b) =>
            (b.onclick = () => {
              const plan = b.dataset.plan,
                url = CONFIG.payLinks[plan];
              if (url) return (location.href = url);
              document.getElementById("pay-title").textContent =
                "Thanh toán – gói " + plan.toLowerCase();
              pay.showModal();
            }),
        );

        document.querySelectorAll("form[data-demo]").forEach(
          (f) =>
            (f.onsubmit = (e) => {
              e.preventDefault();
              if (f.website?.value) return;
              alert(
                "Biểu mẫu mẫu: chưa gửi đi đâu. Xem chú thích trong file để nối dịch vụ form.",
              );
            }),
        );

        document.addEventListener(
          "contextmenu",
          (e) => e.target.closest(".ph, img, video") && e.preventDefault(),
        );
        document.addEventListener(
          "dragstart",
          (e) => e.target.closest("img, video") && e.preventDefault(),
        );
      }
    </script>
  </body>
</html>
